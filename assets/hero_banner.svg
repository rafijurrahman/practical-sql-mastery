<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="1198" height="338" rx="15" stroke="#334155" stroke-width="2"/>

  <!-- Top Academic Pill -->
  <g transform="translate(60, 40)">
    <rect width="460" height="28" rx="14" fill="#0284C7" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1"/>
    <text x="14" y="18" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">
      🎓 BM COLLEGE · DEPT. OF STATISTICS · ACADEMIC CURRICULUM
    </text>
  </g>

  <!-- Main Headline -->
  <text x="60" y="125" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
    Practical SQL Mastery
  </text>
  <text x="60" y="165" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">
    20 Complete Modules · 115 Enterprise Challenges · In-Browser WebAssembly Lab
  </text>

  <!-- Subtitle / Hook -->
  <text x="60" y="210" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
    Built on the BD Shop e-commerce relational dataset (7 tables, 65 student profiles across 6 southern districts).
  </text>
  <text x="60" y="234" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
    Zero database installation required. Run SQLite directly in your browser.
  </text>

  <!-- Bottom Metric Pills -->
  <g transform="translate(60, 270)">
    <!-- Pill 1 -->
    <rect width="180" height="34" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="14" y="22" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">⚡ 115 Queries</text>
    <text x="96" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Evaluated</text>

    <!-- Pill 2 -->
    <g transform="translate(192, 0)">
      <rect width="180" height="34" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="14" y="22" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">📚 20 Modules</text>
      <text x="100" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Structured</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(384, 0)">
      <rect width="210" height="34" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="14" y="22" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">🛒 BD Shop Dataset</text>
      <text x="144" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">(7 Tables)</text>
    </g>

    <!-- Pill 4: Author -->
    <g transform="translate(606, 0)">
      <rect width="270" height="34" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="14" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Architect: <tspan fill="#38BDF8" font-weight="700">Md. Rafijur Rahman</tspan></text>
    </g>
  </g>
</svg>